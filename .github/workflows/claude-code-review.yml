name: Claude Code Review

# Review por IA — cobre os pilares de JULGAMENTO do QUALITY-GATE, que nenhuma
# ferramenta gateia sozinha. Nao repete o que ja e determinístico no CI.
#
# `edited` NAO entra nos types de proposito: diferente do job traceability,
# este review analisa o DIFF, e editar titulo ou corpo do PR nao muda o que
# precisa ser revisado.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `read` e suficiente: a action troca OIDC por app token para comentar
      # (visto no log: "App token successfully obtained"). Menos privilegio.
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # O plugin fornece a mecanica de inline comments que o step
          # `post-buffered-inline-comments` consome no fim do job. Sem ele o
          # Claude analisa e NAO tem como reportar: comprovado no PR #12, onde
          # rodou 8 turns, is_error false, e terminou em
          # "No buffered inline comments".
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # NAO restringir allowedTools aqui: a lista precisaria incluir as
          # ferramentas de comentario do plugin, cujos nomes nao sao estaveis.
          # `--allowedTools Read,Grep,Glob` deixou o revisor mudo no PR #12.
          claude_args: '--max-turns 30'
          # TESTE DE CANAL — temporario, revertido no commit seguinte.
          # Prompt trivial, sem analise: se nem isto postar comentario, o
          # defeito esta na action/plugin e nao no que pedimos ao modelo.
          prompt: |
            Poste UM comentario neste PR com exatamente este texto:

            TESTE DE CANAL: o review por IA consegue postar comentario.

            Nao analise o codigo. Nao faca mais nada. Apenas poste o comentario.
