name: Claude Code Review

# Review por IA — cobre os pilares de JULGAMENTO do QUALITY-GATE, que nenhuma
# ferramenta gateia sozinha. Nao repete o que ja e determinístico no CI.
#
# `edited` NAO entra nos types de proposito: diferente do job traceability,
# este review analisa o DIFF, e editar titulo ou corpo do PR nao muda o que
# precisa ser revisado.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # WRITE e obrigatorio para comentar. A Story 0.6 assumiu que `read`
      # bastava porque o log mostrava "App token successfully obtained" — mas
      # nenhum comentario jamais saiu. O diagnostico (run 31383807624) fechou
      # a questao: prompt trivial pedindo so um comentario resultou em
      # `permission_denials_count: 4` e nenhuma saida.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O revisor precisa do DIFF, e ate aqui nao tinha como obte-lo.
      #
      # Medido no PR #65 (run 32167886053): `duration_ms` 7442, `num_turns` 5,
      # `permission_denials_count` 4 — e `is_error: false`, check VERDE. Ele nao
      # deixou de encontrar violacao: desistiu em sete segundos, porque o prompt
      # manda "revise o diff do PR" e nenhuma ferramenta permitida entrega o
      # diff. `fetch-depth: 1` nao traz a base para comparar, `Bash` nao esta em
      # allowedTools, e nao ha MCP de leitura de PR.
      #
      # Nas vezes em que revisou de verdade (4-6 min, PRs #35 a #60), ele
      # reconstruiu o contexto navegando o repo com `Read`/`Grep` — as vezes
      # persistia, as vezes desistia. Um required check que depende disso e
      # "verde sem alvo": exatamente o que o QUALITY-GATE proibe.
      #
      # A correcao entrega o material por uma ferramenta que JA e permitida
      # (`Read`), em vez de ampliar `allowedTools` — dar `Bash` ao revisor para
      # ele rodar `gh` seria muito mais poder do que o problema exige.
      - name: Capturar o diff do PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" > pr.diff
          # Verifica o ARTEFATO, nao o exit code: um diff vazio faria o revisor
          # aprovar o nada, e o check ficaria verde do mesmo jeito.
          linhas=$(wc -l < pr.diff)
          echo "diff capturado: $linhas linhas"
          test "$linhas" -gt 0 || { echo "::error::diff vazio"; exit 1; }

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # O plugin fornece a mecanica de inline comments que o step
          # `post-buffered-inline-comments` consome no fim do job. Sem ele o
          # Claude analisa e NAO tem como reportar: comprovado no PR #12, onde
          # rodou 8 turns, is_error false, e terminou em
          # "No buffered inline comments".
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # A ferramenta de comentario inline PRECISA estar em allowedTools.
          # Omitir a flag nao significa "permitir tudo": em execucao nao
          # interativa, ferramenta que escreve e negada por padrao. Foi por
          # isso que o revisor ficou mudo em todos os runs — o log acusava
          # permission_denials_count 4 e depois 10.
          # Nome confirmado no fonte do plugin code-review:
          # anthropics/claude-code/plugins/code-review/commands/code-review.md
          # 30 turns era margem apertada demais, e o efeito nao e um review
          # pior — e um required check INSTAVEL. No PR #28 (1015 linhas) a
          # primeira execucao morreu em `error_max_turns` com 31 turns e o
          # re-run, sem nenhuma mudanca, terminou em 26. Mesmo diff, mesmo
          # prompt, desfechos opostos: o merge passou a depender de sorte.
          #
          # 60 nao aumenta o custo de um review que cabe em 26 — turns so sao
          # gastos se usados. Ele so remove o teto de onde a variacao natural
          # bate.
          claude_args: >-
            --max-turns 60
            --allowedTools Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment
          prompt: |
            Voce e o revisor dos PILARES DE JULGAMENTO do ServiceDesk, um service
            desk interno MCP-first com arquitetura hexagonal.

            O diff completo esta em `pr.diff`, na raiz do workspace. **Leia esse
            arquivo com `Read` antes de qualquer outra coisa** — ele e o material
            desta revisao, e sem ele voce nao tem o que revisar. Use `Read` e
            `Grep` no restante do repositorio para entender o CONTEXTO do que
            mudou (o arquivo inteiro, o modulo vizinho, o teste correspondente).

            Revise o diff do PR ${{ github.repository }}#${{ github.event.pull_request.number }}.

            ## Revise EXCLUSIVAMENTE estes quatro pilares

            1. AUDITAVEL — toda mutacao de estado grava registro de auditoria com
               autor e origem (`api` ou `mcp`), na MESMA transacao da mudanca (AD-3,
               AD-9). Mudanca sem rastro a uma Story ou FR.
            2. OBSERVAVEL — erro engolido sem tratamento; ausencia de log onde a
               falha seria invisivel; log nao estruturado. Nao confundir log
               operacional com o Log de auditoria de negocio.
            3. ESCALAVEL — acoplamento que impeca evolucao independente; regra de
               negocio vazando para adapter em vez de viver no dominio (AD-1, AD-2);
               dois pontos de entrada (MCP e HTTP) que poderiam divergir.
            4. PERFORMATICO — N+1, loop caro, I/O desnecessario no caminho quente.

            ## Violacoes de decisao arquitetural (ADs da spine)

            Sinalize violacao de qualquer AD, citando o numero:

            - AD-1 dependencias apontam so para dentro
            - AD-2 o dominio e o unico ponto de mutacao de estado
            - AD-3 auditoria transacional com autor e origem
            - AD-4 Numero gerado e possuido pela persistencia, imutavel
            - AD-5 Status e maquina de estados fechada, validada no dominio
            - AD-6 contratos MCP e API derivam de uma unica fonte Zod
            - AD-7 acoes irreversiveis exigem confirmacao no dominio
            - AD-8 autorizacao (papel + posse) aplicada no dominio
            - AD-9 identidade e origem propagam ate a auditoria
            - AD-10 concorrencia otimista no command handler
            - AD-11 gateway de CI obrigatorio

            ## NAO revise nada disto

            Ja e gateado de forma deterministica no CI. Comentar sobre isso e ruido
            que afoga o sinal:

            - tipos e erros de compilacao (job `typecheck`, tsc strict)
            - estilo, formatacao, lint (job `lint`, Biome)
            - existencia de testes e cobertura minima de 80% (job `test`, Vitest)
            - direcao de dependencia entre camadas (job `arch`, dependency-cruiser)
            - CVEs em dependencias (job `security-deps`, Trivy)
            - segredos no codigo (job `security-secrets`, Gitleaks)
            - formato de mensagem de commit e titulo de PR (job `traceability`)
            - vulnerabilidades que o CodeQL ja reporta
            - arquivos em `_bmad-output/**`: sao artefatos de planejamento e
              registro de story, nao codigo. No PR #28 a story sozinha era 242
              das 1015 linhas do diff, e nenhum pilar se aplica a prosa. Leia
              se precisar de contexto; nao revise.

            ## Como reportar

            - Poste cada achado com a ferramenta
              `mcp__github_inline_comment__create_inline_comment`, passando
              `confirmed: true`, no arquivo e na linha onde o problema esta.
            - Comece nomeando o pilar ou o AD: "[Auditavel]" ou "[AD-3]".
            - Explique a CONSEQUENCIA concreta, nao a regra abstrata: o que quebra,
              para quem, em que situacao.
            - SEMPRE poste ao menos um comentario no PR. Se, depois de analisar,
              voce nao encontrou nenhuma violacao, diga isso explicitamente:
              "Nenhuma violacao dos quatro pilares encontrada neste diff."
              Silencio total nao e resposta valida — nao ha como distinguir
              "analisei e esta limpo" de "nao consegui reportar".
            - Ainda assim, nao invente problema para parecer util. Comentar
              "esta limpo" e melhor do que inventar um achado.
            - Nao sugira refatoracao por gosto pessoal. So aponte o que viola um
              dos quatro pilares ou um AD.

            Contexto completo em `_bmad-output/planning-artifacts/QUALITY-GATE.md`
            e na `ARCHITECTURE-SPINE.md` do repositorio.
