sonar.projectKey=alexandrehst_servicedesk
sonar.organization=alexandrehst

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts

# O lcov.info e gerado pelo job `test` (pnpm test:coverage, Story 0.2) e
# recuperado como artifact pelo job `sonar`. Sem este caminho apontado, o
# SonarCloud reporta 0.0% de cobertura SEM ERRO NENHUM — foi a primeira
# falha silenciosa deste projeto (PR #2, quality gate aprovado com 0.0%).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Artefatos de planejamento BMad e o proprio framework nao sao codigo do
# produto e distorceriam as metricas.
sonar.exclusions=_bmad/**,_bmad-output/**,coverage/**,node_modules/**

# Regras desativadas — falsos positivos causados por codigo em portugues.
#
# S1135 ("complete o TODO"): casa com a palavra "todo" em portugues dentro de
#   comentarios ("todo caso de uso recebe..."). Nao ha TODO real no codigo.
#   Verificado na Story 1.1: `grep -n "TODO:"` nao retorna nada.
# S7718 (parametro de catch deve se chamar `error_`): convencao anglofona. O
#   projeto escreve identificadores e comentarios em portugues por decisao da
#   spine; renomear `erro` para `error_` abandonaria o idioma no meio do codigo.
#
# Reavaliar se um dia o projeto padronizar identificadores em ingles.
sonar.issue.ignore.multicriteria=p1,p2
sonar.issue.ignore.multicriteria.p1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.p1.resourceKey=**/*.ts
sonar.issue.ignore.multicriteria.p2.ruleKey=typescript:S7718
sonar.issue.ignore.multicriteria.p2.resourceKey=**/*.ts
