sonar.projectKey=alexandrehst_servicedesk
sonar.organization=alexandrehst

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts

# O lcov.info e gerado pelo job `test` (pnpm test:coverage, Story 0.2) e
# recuperado como artifact pelo job `sonar`. Sem este caminho apontado, o
# SonarCloud reporta 0.0% de cobertura SEM ERRO NENHUM — foi a primeira
# falha silenciosa deste projeto (PR #2, quality gate aprovado com 0.0%).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Artefatos de planejamento BMad e o proprio framework nao sao codigo do
# produto e distorceriam as metricas.
sonar.exclusions=_bmad/**,_bmad-output/**,coverage/**,node_modules/**
