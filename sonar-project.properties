sonar.projectKey=alexandrehst_servicedesk
sonar.organization=alexandrehst

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts

# O lcov.info e gerado pelo job `test` (pnpm test:coverage, Story 0.2) e
# recuperado como artifact pelo job `sonar`. Sem este caminho apontado, o
# SonarCloud reporta 0.0% de cobertura SEM ERRO NENHUM — foi a primeira
# falha silenciosa deste projeto (PR #2, quality gate aprovado com 0.0%).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Artefatos de planejamento BMad e o proprio framework nao sao codigo do
# produto e distorceriam as metricas.
sonar.exclusions=_bmad/**,_bmad-output/**,coverage/**,node_modules/**

# O ENTRYPOINT fica fora da cobertura, e o criterio e estreito de proposito
# (Story 5.1).
#
# `servidor-mcp.ts` e o unico arquivo do projeto que so contem FIO com o sistema
# operacional: `process.on`, `process.exit` e `connect(new
# StdioServerTransport())`. Ele nao tem um `if` sequer — toda decisao (se o
# intake sobe, o que avisar no boot, em que ordem encerrar) foi extraida para
# `aplicacao.ts`, que esta em 100% de statements e tem teste ate para a ORDEM do
# encerramento.
#
# Essa extracao veio ANTES desta exclusao, e a ordem importa: o arquivo estava
# com 0% porque misturava decisao com fio, e excluir naquele momento teria
# escondido logica de verdade. So depois de nao sobrar decisao nenhuma e que
# excluir passou a ser honesto.
#
# O que prova que ele funciona nao e cobertura, e sim a verificacao contra um
# cliente MCP real, registrada no PR #85: handshake, `tools/list` com 18 tools e
# o ciclo completo de um Chamado — abrir, comentar, mudar status, atribuir,
# resolver e fechar com confirmacao. Um teste unitario com duble de transporte
# confirmaria que `connect` foi chamado, o que nao prova que o servidor fala MCP
# (licao da Story 4.2 sobre dubles).
#
# CRITERIO para acrescentar algo aqui: o arquivo nao pode conter decisao alguma.
# Se aparecer um `if`, ele sai desta lista — nao o contrario.
sonar.coverage.exclusions=src/bootstrap/servidor-mcp.ts

# Regras desativadas — falsos positivos causados por codigo em portugues.
#
# S1135 ("complete o TODO"): casa com a palavra "todo" em portugues dentro de
#   comentarios ("todo caso de uso recebe..."). Nao ha TODO real no codigo.
#   Verificado na Story 1.1: `grep -n "TODO:"` nao retorna nada.
# S7718 (parametro de catch deve se chamar `error_`): convencao anglofona. O
#   projeto escreve identificadores e comentarios em portugues por decisao da
#   spine; renomear `erro` para `error_` abandonaria o idioma no meio do codigo.
#
# Reavaliar se um dia o projeto padronizar identificadores em ingles.
sonar.issue.ignore.multicriteria=p1,p2
sonar.issue.ignore.multicriteria.p1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.p1.resourceKey=**/*.ts
sonar.issue.ignore.multicriteria.p2.ruleKey=typescript:S7718
sonar.issue.ignore.multicriteria.p2.resourceKey=**/*.ts
